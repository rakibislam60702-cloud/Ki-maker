name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create google-services.json for Firebase
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "firebase_url": "https://rakib-ai-engine-default-rtdb.firebaseio.com",
              "project_id": "rakib-ai-engine",
              "storage_bucket": "rakib-ai-engine.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.keyauth.qrvklt"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyD-FakeKeyForBuildingPurposesOnly123"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate standard debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore debug.keystore
          cp ~/.android/debug.keystore app/debug.keystore

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Production APK
        run: ./gradlew assembleDebug --no-daemon -x test -x lint

      - name: Bundle and Package Production Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/Rakib-Official-Admin-Panel.apk
          cd release-assets
          zip -r Rakib-Official-Admin-Panel-Assets.zip .
          cd ..

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rakib-Official-Admin-APK
          path: release-assets/Rakib-Official-Admin-Panel.apk

      - name: Upload Assets ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rakib-Official-Admin-Assets-ZIP
          path: release-assets/Rakib-Official-Admin-Panel-Assets.zip
