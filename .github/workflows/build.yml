name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create mock google-services.json
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "firebase_url": "https://rakib-ai-engine-default-rtdb.firebaseio.com",
              "project_id": "rakib-ai-engine",
              "storage_bucket": "rakib-ai-engine.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:mockappid",
                  "android_client_info": {
                    "package_name": "com.example.keyauth"
                  }
                },
                "api_key": [
                  {
                    "current_key": "fake_api_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build APK (Bypassing signing check)
        run: ./gradlew packageDebug --no-daemon -x test -x lint -x validateSigningDebug

      - name: Find & Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyManager-Admin-APK
          path: app/build/outputs/apk/**/*.apk
